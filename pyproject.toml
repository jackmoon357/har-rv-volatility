[project]
name = "har-rv-volatility"
version = "0.1.0"
description = "HAR-RV baseline and ML overlay for volatility forecasting"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "jupyter>=1.0",
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]